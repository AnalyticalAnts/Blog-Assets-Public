<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 440">

  <!-- Background -->
  <rect width="860" height="440" fill="#0f0f0f"/>

  <!-- Subtle background grid -->
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1a1a1a" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="860" height="440" fill="url(#grid)" opacity="0.6"/>

  <!-- Left glow accent -->
  <ellipse cx="120" cy="220" rx="180" ry="180" fill="#c9a227" opacity="0.04"/>

  <!-- === LEFT TEXT PANEL === -->

  <!-- Eyebrow label -->
  <rect x="52" y="64" width="4" height="18" rx="2" fill="#c9a227"/>
  <text x="64" y="77" fill="#c9a227" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="600" letter-spacing="2.5">CLAUDE CODE</text>

  <!-- Main headline -->
  <text x="52" y="138" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-weight="800" font-size="52" letter-spacing="-1">Load less.</text>
  <text x="52" y="194" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-weight="800" font-size="52" letter-spacing="-1">Get more.</text>

  <!-- Sub text -->
  <text x="52" y="230" fill="#888888" font-family="Arial, Helvetica, sans-serif" font-size="13">Two files auto-load. Skills load the rest</text>
  <text x="52" y="250" fill="#888888" font-family="Arial, Helvetica, sans-serif" font-size="13">only when you need them.</text>

  <!-- Feature pills -->
  <rect x="52" y="270" width="112" height="28" rx="14" fill="#1c1c1c" stroke="#2e2e2e" stroke-width="1"/>
  <text x="108" y="289" text-anchor="middle" fill="#bbbbbb" font-family="Arial, Helvetica, sans-serif" font-size="11">Context-lean</text>

  <rect x="174" y="270" width="108" height="28" rx="14" fill="#1c1c1c" stroke="#2e2e2e" stroke-width="1"/>
  <text x="228" y="289" text-anchor="middle" fill="#bbbbbb" font-family="Arial, Helvetica, sans-serif" font-size="11">On-demand skills</text>

  <rect x="292" y="270" width="100" height="28" rx="14" fill="#1c1c1c" stroke="#2e2e2e" stroke-width="1"/>
  <text x="342" y="289" text-anchor="middle" fill="#bbbbbb" font-family="Arial, Helvetica, sans-serif" font-size="11">Reproducible</text>

  <!-- Divider -->
  <line x1="52" y1="320" x2="400" y2="320" stroke="#242424" stroke-width="1"/>

  <!-- Bottom stat -->
  <text x="52" y="348" fill="#666666" font-family="Arial, Helvetica, sans-serif" font-size="12">why most setups degrade</text>
  <text x="52" y="382" fill="#c9a227" font-family="Arial, Helvetica, sans-serif" font-weight="800" font-size="30">Context overload.</text>
  <text x="52" y="408" fill="#555555" font-family="Arial, Helvetica, sans-serif" font-size="12">load precisely — only when it is needed</text>

  <!-- === RIGHT PANEL: Terminal / Directory Tree === -->

  <!-- Terminal window body -->
  <rect x="464" y="32" width="364" height="376" rx="10" fill="#141414" stroke="#2a2a2a" stroke-width="1"/>

  <!-- Title bar -->
  <rect x="464" y="32" width="364" height="30" rx="10" fill="#1e1e1e"/>
  <rect x="464" y="48" width="364" height="14" fill="#1e1e1e"/>
  <!-- Traffic lights -->
  <circle cx="489" cy="47" r="5" fill="#3a3a3a"/>
  <circle cx="506" cy="47" r="5" fill="#3a3a3a"/>
  <circle cx="523" cy="47" r="5" fill="#3a3a3a"/>
  <!-- Window title -->
  <text x="646" y="52" text-anchor="middle" fill="#4a4a4a" font-family="Arial, Helvetica, sans-serif" font-size="10">claude-configs — private repo</text>

  <!-- Column headers -->
  <text x="488" y="80" fill="#444444" font-family="Arial, Helvetica, sans-serif" font-size="9" letter-spacing="1">FILE</text>
  <text x="700" y="80" fill="#444444" font-family="Arial, Helvetica, sans-serif" font-size="9" letter-spacing="1">LOADS</text>
  <line x1="476" y1="85" x2="816" y2="85" stroke="#1e1e1e" stroke-width="1"/>

  <!-- === DIRECTORY TREE === -->

  <!-- Root -->
  <text x="488" y="106" fill="#888888" font-family="'Courier New', Courier, monospace" font-size="12.5">claude-configs/</text>

  <!-- _Global folder -->
  <text x="488" y="130" fill="#555555" font-family="'Courier New', Courier, monospace" font-size="12">├──</text>
  <text x="520" y="130" fill="#c9a227" font-family="'Courier New', Courier, monospace" font-size="12">_Global/</text>

  <!-- _Global/CLAUDE.md + auto-load badge -->
  <text x="488" y="152" fill="#555555" font-family="'Courier New', Courier, monospace" font-size="12">│   └──</text>
  <text x="548" y="152" fill="#cccccc" font-family="'Courier New', Courier, monospace" font-size="12">CLAUDE.md</text>
  <line x1="625" y1="152" x2="658" y2="152" stroke="#c9a227" stroke-width="1.2" stroke-dasharray="3,2"/>
  <polygon points="658,148 666,152 658,156" fill="#c9a227"/>
  <rect x="670" y="143" width="106" height="17" rx="8" fill="#1a2e1a" stroke="#2d4d2d" stroke-width="1"/>
  <text x="723" y="155" text-anchor="middle" fill="#4ade80" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="600">auto-loaded</text>

  <!-- spacer -->
  <text x="488" y="172" fill="#444444" font-family="'Courier New', Courier, monospace" font-size="12">│</text>

  <!-- my-project folder -->
  <text x="488" y="194" fill="#555555" font-family="'Courier New', Courier, monospace" font-size="12">└──</text>
  <text x="520" y="194" fill="#c9a227" font-family="'Courier New', Courier, monospace" font-size="12">my-project/</text>

  <!-- my-project/.claude/CLAUDE.md + auto-load badge -->
  <text x="488" y="216" fill="#555555" font-family="'Courier New', Courier, monospace" font-size="12">    ├──</text>
  <text x="536" y="216" fill="#cccccc" font-family="'Courier New', Courier, monospace" font-size="12">CLAUDE.md</text>
  <line x1="613" y1="216" x2="658" y2="216" stroke="#c9a227" stroke-width="1.2" stroke-dasharray="3,2"/>
  <polygon points="658,212 666,216 658,220" fill="#c9a227"/>
  <rect x="670" y="207" width="106" height="17" rx="8" fill="#1a2e1a" stroke="#2d4d2d" stroke-width="1"/>
  <text x="723" y="219" text-anchor="middle" fill="#4ade80" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="600">auto-loaded</text>

  <!-- commands/ -->
  <text x="488" y="240" fill="#555555" font-family="'Courier New', Courier, monospace" font-size="12">    ├──</text>
  <text x="536" y="240" fill="#888888" font-family="'Courier New', Courier, monospace" font-size="12">commands/</text>
  <line x1="613" y1="240" x2="658" y2="240" stroke="#555555" stroke-width="1" stroke-dasharray="3,2"/>
  <polygon points="658,236 666,240 658,244" fill="#555555"/>
  <rect x="670" y="231" width="124" height="17" rx="8" fill="#1e1e2a" stroke="#2d2d4d" stroke-width="1"/>
  <text x="732" y="243" text-anchor="middle" fill="#818cf8" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="600">invoked by /skill</text>

  <!-- commands children -->
  <text x="488" y="259" fill="#444444" font-family="'Courier New', Courier, monospace" font-size="11">    │   ├──</text>
  <text x="560" y="259" fill="#666666" font-family="'Courier New', Courier, monospace" font-size="11">content.md</text>
  <text x="488" y="276" fill="#444444" font-family="'Courier New', Courier, monospace" font-size="11">    │   └──</text>
  <text x="560" y="276" fill="#666666" font-family="'Courier New', Courier, monospace" font-size="11">review.md</text>

  <!-- context/ -->
  <text x="488" y="300" fill="#555555" font-family="'Courier New', Courier, monospace" font-size="12">    └──</text>
  <text x="536" y="300" fill="#888888" font-family="'Courier New', Courier, monospace" font-size="12">context/</text>
  <line x1="606" y1="300" x2="658" y2="300" stroke="#555555" stroke-width="1" stroke-dasharray="3,2"/>
  <polygon points="658,296 666,300 658,304" fill="#555555"/>
  <rect x="670" y="291" width="130" height="17" rx="8" fill="#2a1e1e" stroke="#4d2d2d" stroke-width="1"/>
  <text x="735" y="303" text-anchor="middle" fill="#f87171" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="600">loaded by skills only</text>

  <!-- context children -->
  <text x="488" y="319" fill="#444444" font-family="'Courier New', Courier, monospace" font-size="11">        ├──</text>
  <text x="572" y="319" fill="#666666" font-family="'Courier New', Courier, monospace" font-size="11">style-guide.md</text>
  <text x="488" y="336" fill="#444444" font-family="'Courier New', Courier, monospace" font-size="11">        └──</text>
  <text x="572" y="336" fill="#666666" font-family="'Courier New', Courier, monospace" font-size="11">domain-context.md</text>

  <!-- Footer rule inside terminal -->
  <line x1="476" y1="354" x2="816" y2="354" stroke="#1e1e1e" stroke-width="1"/>
  <text x="646" y="374" text-anchor="middle" fill="#444444" font-family="'Courier New', Courier, monospace" font-size="10">.claude/ in .gitignore  ·  never committed to project repo</text>

  <!-- Analytical Ants branding -->
  <text x="52" y="432" fill="#3a3a3a" font-family="Arial, Helvetica, sans-serif" font-size="11">analyticalants.com</text>

</svg>
