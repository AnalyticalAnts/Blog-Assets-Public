<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 440">

  <!-- Background -->
  <rect width="860" height="440" fill="#0f0f0f"/>

  <!-- Subtle background grid -->
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1a1a1a" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="860" height="440" fill="url(#grid)" opacity="0.6"/>

  <!-- Left glow accent -->
  <ellipse cx="120" cy="220" rx="180" ry="180" fill="#c9a227" opacity="0.04"/>

  <!-- === LEFT TEXT PANEL === -->

  <!-- Eyebrow label -->
  <rect x="52" y="64" width="4" height="18" rx="2" fill="#c9a227"/>
  <text x="64" y="77" fill="#c9a227" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="600" letter-spacing="2.5">VIRTUAL BUSINESS CARD</text>

  <!-- Main headline -->
  <text x="52" y="132" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-weight="800" font-size="40" letter-spacing="-0.5">Built,</text>
  <text x="52" y="178" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-weight="800" font-size="40" letter-spacing="-0.5">not bought.</text>

  <!-- Sub text -->
  <text x="52" y="216" fill="#888888" font-family="Arial, Helvetica, sans-serif" font-size="15">QR code · vCard download · Randomized URL</text>

  <!-- Feature pills row 1 -->
  <rect x="52" y="238" width="120" height="28" rx="14" fill="#1c1c1c" stroke="#2e2e2e" stroke-width="1"/>
  <text x="112" y="257" text-anchor="middle" fill="#bbbbbb" font-family="Arial, Helvetica, sans-serif" font-size="11">No subscription</text>

  <rect x="182" y="238" width="126" height="28" rx="14" fill="#1c1c1c" stroke="#2e2e2e" stroke-width="1"/>
  <text x="245" y="257" text-anchor="middle" fill="#bbbbbb" font-family="Arial, Helvetica, sans-serif" font-size="11">No vendor lock-in</text>

  <!-- Feature pills row 2 -->
  <rect x="52" y="276" width="108" height="28" rx="14" fill="#1c1c1c" stroke="#2e2e2e" stroke-width="1"/>
  <text x="106" y="295" text-anchor="middle" fill="#bbbbbb" font-family="Arial, Helvetica, sans-serif" font-size="11">Scales to 100+</text>

  <rect x="170" y="276" width="112" height="28" rx="14" fill="#1c1c1c" stroke="#2e2e2e" stroke-width="1"/>
  <text x="226" y="295" text-anchor="middle" fill="#bbbbbb" font-family="Arial, Helvetica, sans-serif" font-size="11">Owned forever</text>

  <!-- Divider -->
  <line x1="52" y1="326" x2="320" y2="326" stroke="#242424" stroke-width="1"/>

  <!-- Cost stat -->
  <text x="52" y="354" fill="#666666" font-family="Arial, Helvetica, sans-serif" font-size="12">100 employees · subscription alternative</text>
  <text x="52" y="388" fill="#c9a227" font-family="Arial, Helvetica, sans-serif" font-weight="800" font-size="34">$14,400</text>
  <text x="208" y="388" fill="#555555" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400">/yr</text>
  <text x="52" y="410" fill="#555555" font-family="Arial, Helvetica, sans-serif" font-size="12">eliminated — afternoon of work</text>

  <!-- === PHONE MOCKUP === -->

  <!-- Phone body -->
  <rect x="550" y="18" width="256" height="404" rx="38" fill="#1a1a1a" stroke="#2a2a2a" stroke-width="2"/>
  <!-- Phone inner border -->
  <rect x="557" y="25" width="242" height="390" rx="33" fill="none" stroke="#222222" stroke-width="1"/>

  <!-- Screen area -->
  <rect x="562" y="48" width="232" height="362" fill="#141414" rx="4"/>

  <!-- Top pill notch -->
  <rect x="632" y="34" width="92" height="10" rx="5" fill="#252525"/>

  <!-- Side buttons -->
  <rect x="548" y="100" width="3" height="28" rx="1.5" fill="#222"/>
  <rect x="548" y="136" width="3" height="28" rx="1.5" fill="#222"/>
  <rect x="805" y="110" width="3" height="48" rx="1.5" fill="#222"/>

  <!-- Bottom indicator -->
  <rect x="647" y="400" width="62" height="4" rx="2" fill="#252525"/>

  <!-- === CARD INSIDE PHONE === -->

  <!-- Top accent bar (primary color) -->
  <rect x="562" y="48" width="232" height="6" rx="2" fill="#c9a227"/>

  <!-- Profile photo area -->
  <circle cx="678" cy="138" r="44" fill="#202020" stroke="#2a2a2a" stroke-width="1"/>
  <circle cx="678" cy="138" r="42" fill="none" stroke="#c9a227" stroke-width="1.5" stroke-opacity="0.25"/>
  <!-- Person silhouette -->
  <circle cx="678" cy="124" r="15" fill="#333"/>
  <ellipse cx="678" cy="158" rx="22" ry="13" fill="#333"/>

  <!-- Name -->
  <text x="678" y="200" text-anchor="middle" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="15.5">Jane Doe</text>

  <!-- Title -->
  <text x="678" y="216" text-anchor="middle" fill="#c9a227" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="9" letter-spacing="2">MARKETING DIRECTOR</text>

  <!-- Company -->
  <text x="678" y="230" text-anchor="middle" fill="#666666" font-family="Arial, Helvetica, sans-serif" font-size="10">Company</text>

  <!-- Divider line -->
  <line x1="576" y1="240" x2="780" y2="240" stroke="#222" stroke-width="1"/>

  <!-- Phone row -->
  <circle cx="590" cy="256" r="5.5" fill="none" stroke="#c9a227" stroke-width="1.3"/>
  <text x="604" y="260" fill="#999999" font-family="Arial, Helvetica, sans-serif" font-size="9.5">123 · 456 · 7890</text>

  <!-- Email row -->
  <rect x="585" y="270" width="11" height="8" rx="1.5" fill="none" stroke="#c9a227" stroke-width="1.2"/>
  <text x="604" y="278" fill="#999999" font-family="Arial, Helvetica, sans-serif" font-size="9.5">email@company.com</text>

  <!-- LinkedIn row -->
  <rect x="585" y="287" width="11" height="11" rx="2.5" fill="#c9a227"/>
  <text x="590.5" y="296.5" fill="#000" font-family="Arial, Helvetica, sans-serif" font-size="7.5" font-weight="700">in</text>
  <text x="604" y="297" fill="#999999" font-family="Arial, Helvetica, sans-serif" font-size="9.5">linkedin.com/in/JaneDoe</text>

  <!-- Website row -->
  <circle cx="590" cy="313" r="5.5" fill="none" stroke="#c9a227" stroke-width="1.3"/>
  <line x1="584.5" y1="313" x2="595.5" y2="313" stroke="#c9a227" stroke-width="0.8"/>
  <text x="604" y="317" fill="#999999" font-family="Arial, Helvetica, sans-serif" font-size="9.5">Company URL</text>

  <!-- Save Contact button -->
  <rect x="576" y="330" width="204" height="34" rx="7" fill="#c9a227"/>
  <text x="678" y="351" text-anchor="middle" fill="#000000" font-family="Arial, Helvetica, sans-serif" font-weight="800" font-size="12" letter-spacing="0.8">+ SAVE CONTACT</text>

  <!-- Phone footer text -->
  <text x="678" y="396" text-anchor="middle" fill="#333333" font-family="Arial, Helvetica, sans-serif" font-size="7">Company · Your Industry Here</text>

  <!-- Analytical Ants branding bottom left -->
  <text x="52" y="432" fill="#3a3a3a" font-family="Arial, Helvetica, sans-serif" font-size="11">analyticalants.com</text>

</svg>
